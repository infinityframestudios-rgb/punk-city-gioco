<title>Punk City</title>
<style>
html,body{margin:0;height:100%;background:#05010a;font-family:"Trebuchet MS",Arial,sans-serif;color:#fff;overflow:hidden}
body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 45%,#2a0838 0%,#05010a 75%)}
.t1{font:900 110px/1 "Trebuchet MS",sans-serif;color:#ff2fb3;text-shadow:0 0 30px #ff2fb3,0 6px 0 #000;margin:0;letter-spacing:.04em}
.t2{font:bold 30px "Trebuchet MS",sans-serif;color:#00f0ff;letter-spacing:4px;margin:10px 0 0}
.t3{margin:18px 0 0;font:bold 20px "Trebuchet MS",sans-serif;color:#ffd34d;max-width:900px;text-shadow:0 2px 0 #000}
.riga{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:40px}
a{text-decoration:none}
button,a.grosso{display:inline-block;min-width:220px;min-height:56px;line-height:32px;font:bold 25px "Trebuchet MS",sans-serif;color:#fff;background:#1a0630;border:3px solid #00f0ff;border-radius:12px;padding:12px 22px;box-shadow:0 0 14px #00f0ff88;cursor:pointer}
a.rosa{border-color:#ff2fb3;background:#4a0838;box-shadow:0 0 14px #ff2fb366}
a.oro{border-color:#ffd34d;color:#ffd34d;box-shadow:0 0 14px #ffd34d66}
.second{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.second a{min-width:180px;min-height:48px;font-size:18px;box-shadow:none;opacity:.95}
small{display:block;margin-top:28px;color:#9fdcff;font-size:16px}
@media (max-width:900px){.t1{font-size:clamp(56px,16vw,110px)}.t2{font-size:clamp(16px,4vw,30px)}}

</head>
