<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Punk City — Le Fogne</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#05010a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;font-family:"Trebuchet MS",Arial,sans-serif;color:#fff}
body{position:fixed;inset:0;height:100vh;height:100dvh}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui button,#ui .win,#titolo,#dialogo,#pausa,#fine{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
.nascosto{display:none!important}

#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:max(10px,env(safe-area-inset-top)) 16px 0;pointer-events:none}
#luogo{font:900 28px/1.05 "Trebuchet MS",sans-serif;letter-spacing:6px;color:#ff2fb3;text-shadow:0 0 16px #ff2fb3,0 3px 0 #000}
#risorse{margin-top:6px;font:bold 16px "Trebuchet MS",sans-serif;color:#9fdcff;letter-spacing:1px;text-shadow:0 2px 0 #000}
.hud-dx{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#pausaBtn{pointer-events:auto;font:bold 22px "Trebuchet MS",sans-serif;color:#fff;background:#120422dd;border:3px solid #ffd34d;border-radius:14px;padding:8px 16px;box-shadow:0 0 12px #ffd34d55}

/* finestre stile JRPG Punk City: vetro viola, bordo bianco, alone neon rosa */
.win{background:linear-gradient(180deg,#2b0f5ef2 0%,#170638f5 55%,#0b0220f8 100%);border:4px solid #f4ecff;border-radius:14px;box-shadow:0 0 0 3px #1a0630,0 0 0 6px #ff2fb3aa,0 0 26px #ff2fb355,inset 0 0 26px #00000088;color:#fff;text-shadow:2px 2px 0 #000}

#titolo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 45%,#2a0838ee 0%,#05010aff 75%);text-align:center;padding:24px;z-index:5}
#titolo .t1{font:900 110px/1 "Trebuchet MS",sans-serif;color:#ff2fb3;text-shadow:0 0 30px #ff2fb3,0 6px 0 #000;margin:0;letter-spacing:.04em}
#titolo .t2{font:bold 30px "Trebuchet MS",sans-serif;color:#00f0ff;letter-spacing:4px}
#titolo .t3{margin-top:8px;font:bold 20px "Trebuchet MS",sans-serif;color:#ffd34d;max-width:900px;text-shadow:0 2px 0 #000}
#notaSalva{color:#9fdcff;font-size:18px;min-height:24px;text-shadow:0 2px 0 #000}
.riga{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:28px}
button.grosso{min-width:220px;min-height:56px;font:bold 25px "Trebuchet MS",sans-serif;color:#fff;background:#1a0630;border:3px solid #00f0ff;border-radius:12px;padding:12px 22px;box-shadow:0 0 14px #00f0ff88}
button.grosso.oro{border-color:#ffd34d;box-shadow:0 0 14px #ffd34d66;color:#ffd34d}
button.grosso.rosa{border-color:#ff2fb3;background:#4a0838;box-shadow:0 0 14px #ff2fb366}
button.grosso:disabled{opacity:.35;box-shadow:none}

#dialogo{position:absolute;left:90px;right:90px;bottom:max(26px,env(safe-area-inset-bottom));min-height:170px;padding:30px 44px 26px;border-radius:16px;background:linear-gradient(180deg,#2b0f5ef2 0%,#160636f5 55%,#0b0220f8 100%);border:4px solid #f4ecff;box-shadow:0 0 0 3px #1a0630,0 0 0 6px #ff2fb3,0 0 30px #ff2fb388,inset 0 0 30px #00000088;color:#fff;font:bold 31px/1.45 "Trebuchet MS",sans-serif;text-shadow:2px 2px 0 #000;cursor:pointer}
#chi{position:absolute;left:30px;top:-26px;padding:4px 22px;font:900 25px "Trebuchet MS",sans-serif;letter-spacing:2px;background:#0b0220;border:3px solid #f4ecff;border-radius:10px;color:#ffd34d;box-shadow:0 0 0 2px #ff2fb3}
#chi:empty{display:none}
#testo{min-height:90px;white-space:pre-wrap}
#scelte{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#scelte button{text-align:left;font:bold 29px "Trebuchet MS",sans-serif;color:#fff;background:#ffffff10;border:2px solid #ffffff40;border-radius:10px;padding:8px 18px 8px 52px;position:relative;cursor:pointer;text-shadow:2px 2px 0 #000}
#scelte button:hover,#scelte button.sel{background:#ff2fb340;border-color:#ff2fb3}
#scelte button:hover:before,#scelte button.sel:before{content:"☛";position:absolute;left:14px;color:#ffd34d}

#joy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:190px;height:190px;border-radius:50%;border:4px solid #00f0ffaa;background:radial-gradient(circle,#00f0ff22,#00f0ff08 70%)}
#pomello{position:absolute;left:53px;top:53px;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#00f0ff 60%,#006a80);box-shadow:0 0 18px #00f0ff;display:block;pointer-events:none}
#azione{position:absolute;right:max(34px,env(safe-area-inset-right));bottom:max(40px,env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;font:900 26px "Trebuchet MS",sans-serif;color:#fff;background:radial-gradient(circle at 50% 35%,#ff2fb3,#5a0840);border:4px solid #fff;box-shadow:0 0 24px #ff2fb3}

#pausa,#fine{position:absolute;inset:0;background:#05010ae6;display:flex;align-items:center;justify-content:center;padding:16px}
#pausa .win,#fine .win{width:min(720px,100%);padding:26px 34px}
#pausa h2,#fine h2,.win h2{margin:0 0 10px;font:900 40px "Trebuchet MS",sans-serif;color:#ffd34d;letter-spacing:3px;text-shadow:0 0 18px #ff8a00,0 4px 0 #000}
.schede{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.schede button{font:bold 20px "Trebuchet MS",sans-serif;color:#fff;background:#1a0630;border:2px solid #ffffff40;border-radius:12px;padding:8px 14px}
.schede button.on{border-color:#ffd34d;color:#ffd34d;box-shadow:0 0 12px #ffd34d55}
#corpoPausa{font:bold 22px/1.45 "Trebuchet MS",sans-serif;min-height:80px}
#corpoPausa b{color:#ffd34d}
#fine p{font:bold 24px/1.45 "Trebuchet MS",sans-serif;max-width:640px}

#gira{display:none;position:fixed;inset:0;z-index:9;background:radial-gradient(circle at 50% 40%,#2a0838 0%,#05010af2 70%);color:#ff2fb3;align-items:center;justify-content:center;text-align:center;padding:24px;font:bold 22px "Trebuchet MS",sans-serif;text-shadow:0 0 12px #ff2fb3}
@media (orientation:portrait) and (max-width:900px){#gira{display:flex}}
@media (max-width:900px){
  #titolo .t1{font-size:clamp(56px,16vw,110px)}
  #titolo .t2{font-size:clamp(16px,4vw,30px)}
  #dialogo{left:16px;right:16px;padding:26px 22px 20px;font-size:24px;min-height:140px}
  #joy{width:150px;height:150px}
  #pomello{left:39px;top:39px;width:72px;height:72px}
  #azione{width:120px;height:120px;font-size:22px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud" class="nascosto">
    <div><div id="luogo"></div><div id="risorse"></div></div>
    <div class="hud-dx"><button id="pausaBtn" type="button">Pausa</button></div>
  </div>
  <div id="titolo">
    <div class="t1">PUNK CITY</div>
    <div class="t2">CAPITOLO 1 · LE FOGNE</div>
    <div class="t3">«In questa città il sangue si paga a rate. Io sono venuto a riscuotere.» — Ras</div>
    <div class="riga">
      <button class="grosso rosa" id="nuova" type="button">Nuova partita</button>
      <button class="grosso oro" id="continua" type="button">Continua</button>
    </div>
    <p id="notaSalva"></p>
  </div>
  <div id="dialogo" class="nascosto"><div id="chi"></div><div id="testo"></div><div id="scelte"></div></div>
  <div id="joy" class="nascosto"><i id="pomello"></i></div>
  <button id="azione" class="nascosto" type="button">Parla</button>
  <div id="pausa" class="nascosto"><div class="win">
    <h2>Pausa</h2>
    <div class="schede" id="schedePausa"></div>
    <div id="corpoPausa"></div>
    <div class="riga" style="margin-top:12px"><button class="grosso" id="chiudiPausa" type="button">Riprendi</button></div>
  </div></div>
  <div id="fine" class="nascosto"><div class="win">
    <h2>Le Fogne</h2>
    <p id="fineTesto"></p>
    <div class="riga"><button class="grosso oro" id="tornaTitolo" type="button">Torna al titolo</button></div>
  </div></div>
</div>
<div id="gira">Gira il telefono in orizzontale<br>per entrare nelle Fogne</div>
<script type="module" src="./gioco.js"></script>
</body>
</html>
